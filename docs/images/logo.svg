<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="beak-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="beak-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Precision Dashed Telemetry Ring -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Coordinate Crosshair Markers -->
      <line x1="0" y1="-380" x2="0" y2="-330" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="380" x2="0" y2="330" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="-330" y1="0" x2="-280" y2="0" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="330" y1="0" x2="280" y2="0" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>

      <!-- ==================================================== -->
      <!-- THE SURGICAL FALCON MASCOT (85% Mass Low-Poly Origami) -->
      <!-- ==================================================== -->

      <!-- 1. Watertight Solid Obsidian Base Silhouette -->
      <path d="
        M 0, -290
        L 85, -245
        L 145, -200
        L 230, -95
        L 260, 60
        L 220, 180
        L 165, 275
        L 75, 335
        L 0, 360
        L -75, 335
        L -165, 275
        L -220, 180
        L -260, 60
        L -230, -95
        L -145, -200
        L -85, -245
        Z
      " fill="#0b0f19" />

      <!-- 2. Mantle & Tactical Wing Plates (Backdrop) -->
      <polygon points="0,360 75,335 165,275 110,180 0,230" fill="#1e293b" />
      <polygon points="0,360 -75,335 -165,275 -110,180 0,230" fill="#0f172a" />
      <polygon points="165,275 220,180 180,90 110,180" fill="#334155" />
      <polygon points="-165,275 -220,180 -180,90 -110,180" fill="#1e293b" />
      <polygon points="220,180 260,60 210,-10 180,90" fill="#1e293b" />
      <polygon points="-220,180 -260,60 -210,-10 -180,90" fill="#0f172a" />
      <polygon points="260,60 230,-95 160,-50 210,-10" fill="#334155" />
      <polygon points="-260,60 -230,-95 -160,-50 -210,-10" fill="#1e293b" />

      <!-- 3. Chest & Armor Pectoral Facets -->
      <polygon points="0,230 110,180 80,70 0,110" fill="#334155" />
      <polygon points="0,230 -110,180 -80,70 0,110" fill="#1e293b" />
      <polygon points="0,110 80,70 60,-20 0,10" fill="#475569" />
      <polygon points="0,110 -80,70 -60,-20 0,10" fill="#1e293b" />

      <!-- 4. Crown & Forehead Facets -->
      <polygon points="0,-290 85,-245 45,-180 0,-210" fill="#334155" />
      <polygon points="0,-290 -85,-245 -45,-180 0,-210" fill="#1e293b" />
      <polygon points="0,-210 45,-180 30,-105 0,-120" fill="#475569" />
      <polygon points="0,-210 -45,-180 -30,-105 0,-120" fill="#1e293b" />
      <polygon points="85,-245 145,-200 110,-130 45,-180" fill="#1e293b" />
      <polygon points="-85,-245 -145,-200 -110,-130 -45,-180" fill="#0f172a" />
      <polygon points="145,-200 230,-95 165,-60 110,-130" fill="#334155" />
      <polygon points="-145,-200 -230,-95 -165,-60 -110,-130" fill="#1e293b" />

      <!-- 5. Temporal & Malar Cheek Facets -->
      <polygon points="110,-130 165,-60 100,-20 60,-75" fill="#1e293b" />
      <polygon points="-110,-130 -165,-60 -100,-20 -60,-75" fill="#0f172a" />
      <polygon points="45,-180 110,-130 60,-75 30,-105" fill="#334155" />
      <polygon points="-45,-180 -110,-130 -60,-75 -30,-105" fill="#1e293b" />

      <!-- 6. Sharp Predator Eye Sockets & Electric Cyan Optics -->
      <!-- Left Eye Socket & Eye -->
      <polygon points="-30,-105 -60,-75 -100,-20 -35,-45" fill="#090d16" />
      <polygon points="-42,-90 -85,-48 -45,-55" fill="url(#cyan-glow)" />
      <polygon points="-50,-80 -65,-55 -48,-60" fill="#ffffff" />
      <!-- Right Eye Socket & Eye -->
      <polygon points="30,-105 60,-75 100,-20 35,-45" fill="#090d16" />
      <polygon points="42,-90 85,-48 45,-55" fill="url(#cyan-glow)" />
      <polygon points="50,-80 65,-55 48,-60" fill="#ffffff" />

      <!-- 7. Hooked Raptor Titanium Beak (The Surgical Blade) -->
      <!-- Upper Beak Bridge -->
      <polygon points="0,-120 30,-105 35,-45 0,-30" fill="url(#beak-light)" />
      <polygon points="0,-120 -30,-105 -35,-45 0,-30" fill="url(#beak-shadow)" />
      <!-- Beak Hook Center -->
      <polygon points="0,-30 35,-45 32,25 0,75" fill="url(#beak-light)" />
      <polygon points="0,-30 -35,-45 -32,25 0,75" fill="url(#beak-shadow)" />
      <!-- Sharp Curving Beak Tip -->
      <polygon points="0,75 22,50 12,105 0,118" fill="#64748b" />
      <polygon points="0,75 -22,50 -12,105 0,118" fill="#0f172a" />
      <!-- Razor Cutting Edge Highlight -->
      <line x1="0" y1="-30" x2="0" y2="118" stroke="#00f5ff" stroke-width="2.5" opacity="0.8" />

      <!-- 8. Subtle Seam Accents (Cyan Precision Lines) -->
      <line x1="80" y1="70" x2="165" y2="275" stroke="#00f5ff" stroke-width="2" opacity="0.4" />
      <line x1="-80" y1="70" x2="-165" y2="275" stroke="#00f5ff" stroke-width="2" opacity="0.4" />
      <line x1="45" y1="-180" x2="145" y2="-200" stroke="#00f5ff" stroke-width="1.5" opacity="0.5" />
      <line x1="-45" y1="-180" x2="-145" y2="-200" stroke="#00f5ff" stroke-width="1.5" opacity="0.5" />

    </g>
  </g>
</svg>
