<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Session Card Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .badge { display: inline-block; padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 9999px; background: #0284c7; color: white; margin-bottom: 12px; }
    h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 600; }
    p { margin: 0 0 16px 0; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card" id="agent-review-card">
    <span class="badge" id="badge-status">In Review</span>
    <h2 id="card-title">Token Verification Flow</h2>
    <p id="card-desc">Reviewing authentication handler refactoring for context cancellation support.</p>
    <button class="btn" id="approve-action-btn">Approve Changes</button>
  </div>
</body>
</html>
